<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Button</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .btn {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: #840132;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #6a132c;
        }
    </style>
</head>
<body>

    <a href="programs/Aviation-Certificate.html" class="btn">Aviation</a>

</body>
</html>
